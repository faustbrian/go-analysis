schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: ".verification"

api:
  baselines:
    - module: "."
      mode: apidiff
      path: api/baseline.txt

mutation:
  root: ".verification/mutation"
  imports:
    - module: "."
      archive: ".verification/mutation/bootstrap/root.zip"
      ledger: ".verification/mutation/migration-ledger.json"

operations:
  - module: "."
    gate: local-test
    steps:
      - type: go-test
        packages: [./analysis]
        run: '^Test(WriteSARIFIncludesStableRulesAndNoSource|WritersRejectPathsThatCouldExposeWorkspace)$'
        count: 1
        timeout: 1m
  - module: "."
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: package-specific
        timeout: 20m
  - module: "."
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: "."
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: compatibility
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        run: '^TestWriteSARIFIncludesStableRulesAndNoSource$|^TestWritersEncodeEmptyInventoriesAsArrays$|^TestWritersRejectPathsThatCouldExposeWorkspace$'
        count: 1
        timeout: 20m
      - type: go-test
        packages:
          - ./cmd/golib-analysis
        run: '^TestRunCheckEmitsSARIFForAdvisoryFinding$'
        count: 1
        timeout: 20m
  - module: "."
    gate: fuzz
    steps:
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzDecodeConfig$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzParseSuppressions$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzReportWriters$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysistestkit
        fuzz: '^FuzzAnalyzersNoPanic$'
        budget: 10000x
        timeout: 20m
  - module: "."
    gate: benchmark
    steps:
      - type: go-test
        packages:
          - ./analysis
          - ./analysistestkit
        benchmark: .
        budget: 1s
        timeout: 20m
