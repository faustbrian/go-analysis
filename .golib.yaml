schema_version: 1
tool_version: v1.0.5
tool_checksums_sha256: 7ee6c6c9bccd76cc1071fb891073055d393701abaed047e0357370f128ba771b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: ".verification"

mutation:
  root: ".verification/mutation"
  imports:
    - module: "."
      archive: ".verification/mutation/bootstrap/root.zip"
      ledger: ".verification/mutation/migration-ledger.json"

operations:
  - module: "."
    gate: api
    steps:
      - type: make
        makefile: verification/package.mk
        target: compatibility
        timeout: 20m
  - module: "."
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: package-specific
        timeout: 20m
  - module: "."
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: "."
    gate: fuzz
    steps:
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzDecodeConfig$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzParseSuppressions$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzReportWriters$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysistestkit
        fuzz: '^FuzzAnalyzersNoPanic$'
        budget: 10000x
        timeout: 20m
  - module: "."
    gate: benchmark
    steps:
      - type: go-test
        packages:
          - ./analysis
          - ./analysistestkit
        benchmark: .
        budget: 1s
        timeout: 20m
