schema_version: 1
tool_version: v1.3.0
tool_checksums_sha256: 72d38d7d0cab33bfeb9345df6b141eacf9841c5d6817f597ff25b957dc8dc48f

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: ".verification"

mutation:
  root: ".verification/mutation"
  imports:
    - module: "."
      archive: ".verification/mutation/bootstrap/root.zip"
      ledger: ".verification/mutation/migration-ledger.json"

operations:
  - module: "."
    gate: api
    steps:
      - type: make
        makefile: verification/package.mk
        target: compatibility
        timeout: 20m
  - module: "."
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: package-specific
        timeout: 20m
  - module: "."
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: "."
    gate: conformance
    steps:
      - type: go-test
        packages:
          - ./analysis
        run: '^TestWriteSARIFIncludesStableRulesAndNoSource$|^TestWritersEncodeEmptyInventoriesAsArrays$|^TestWritersRejectPathsThatCouldExposeWorkspace$'
        count: 1
        timeout: 20m
      - type: go-test
        packages:
          - ./cmd/golib-analysis
        run: '^TestRunCheckEmitsSARIFForAdvisoryFinding$'
        count: 1
        timeout: 20m
  - module: "."
    gate: fuzz
    steps:
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzDecodeConfig$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzParseSuppressions$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysis
        fuzz: '^FuzzReportWriters$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages:
          - ./analysistestkit
        fuzz: '^FuzzAnalyzersNoPanic$'
        budget: 10000x
        timeout: 20m
  - module: "."
    gate: benchmark
    steps:
      - type: go-test
        packages:
          - ./analysis
          - ./analysistestkit
        benchmark: .
        budget: 1s
        timeout: 20m
